name: 'import_concentration_risk'
version: '1.0.0'
config-version: 2

profile: 'import_concentration_risk'

model-paths: ["models"]
seed-paths: ["../data/reference"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # First year US Census/Comtrade data is native HS2022 (H6) rather than
  # HS2017 (H5). Years before this are H5. See CLAUDE.md's HS bridge section.
  h6_boundary_year: 2022
  # Distance (km) from a route line to a chokepoint point within which the
  # route counts as crossing it. 200 is the headline; the rest are
  # sensitivities. The only place these values are defined.
  crossing_thresholds_km: [50, 100, 200, 300]

models:
  import_concentration_risk:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  import_concentration_risk:
    # Every code column is text: HS, port, district and country codes carry
    # leading zeros ("0101", "01") or must never be treated as numbers.
    generated:
      hs_bridge:
        +column_types: {canonical_product_id: text, hs_version: text, hs6_code: text}
      census_ports:
        +column_types: {port_code: text, district_code: text}
      census_country_crosswalk:
        +column_types: {cty_code: text, iso2: text, iso3: text}
      # Written by ingest/routing.py and loaded into raw by load.py, not seeded.
      routes:
        +enabled: false
      routing_matrix:
        +enabled: false
    manual:
      basket_codes:
        +column_types: {hs6_code: text, hs_version: text}
      bridge_overrides:
        +column_types: {h5_code: text, h6_code: text}
      district_coast_map:
        +column_types: {district_code: text}
      port_coast_overrides:
        +column_types: {port_code: text}
      country_crosswalk_overrides:
        +column_types: {cty_code: text, iso3: text}
      comtrade_partner_overrides:
        +column_types: {partner_code: text, iso3: text, partner_name: text}
    # Test fixtures from the verification phase, compared against models by
    # tests. Never read by a model as an input.
    fixtures:
      mode_shares_expected:
        +column_types: {hs6_code: text}
